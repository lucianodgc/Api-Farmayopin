services:

  backend:
    build: ./backend
    container_name: farmayopin-backend
    ports:
      - "8080:8080"
    environment:
      DB_HOST: database
      DB_PORT: 3306
      DB_NAME: farmayopin
      DB_USER: root
      DB_PASSWORD: root
    depends_on:
      - database

  database:
    image: mariadb:11
    container_name: farmayopin-db
    environment:
      MARIADB_ROOT_PASSWORD: root
      MARIADB_DATABASE: farmayopin
    ports:
      - "3306:3306"
    volumes:
      - mariadb_data:/var/lib/mysql

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: farmayopin-phpmyadmin
    ports:
      - "8081:80"
    environment:
      PMA_HOST: database
      PMA_PORT: 3306
    depends_on:
      - database


volumes:
  mariadb_data: